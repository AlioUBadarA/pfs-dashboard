<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace Digital Fundamentals</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/espace.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <img src="assets/logo-pfs.png" alt="Partners in Food Solutions" width="277" height="96">
        <div class="brand-text">
          <span class="brand-title">Digital Fundamentals</span>
          <span class="brand-sub" id="who">Coordination et formateurs</span>
        </div>
      </div>
      <div class="top-actions" id="top-actions" hidden>
        <button type="button" class="btn ghost" id="refresh">Actualiser</button>
        <button type="button" class="btn" id="logout">Se déconnecter</button>
      </div>
    </div>
    <nav class="tabs-bar" id="bar" hidden>
      <div class="tabs" id="tabs" role="tablist"></div>
    </nav>
  </header>

  <main class="esp" id="app" aria-live="polite">
    <section class="login" id="login">
      <div class="login-card">
        <div class="login-logos">
          <img src="assets/logo-pfs.png" alt="Partners in Food Solutions" width="277" height="96">
          <img src="assets/logo-oo2.png" alt="Oo2 Formations &amp; Consulting" width="288" height="96">
        </div>
        <h1>Espace Digital Fundamentals</h1>
        <p class="soft">Entrez votre adresse e-mail. Vous recevrez un code à 6 chiffres.</p>
        <form id="f-email" novalidate>
          <label for="email">Adresse e-mail</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" required maxlength="120">
          <button type="submit" class="btn block">Recevoir un code</button>
        </form>
        <form id="f-code" novalidate hidden>
          <p class="soft" id="code-msg"></p>
          <label for="code" class="center">Code reçu par e-mail</label>
          <input id="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="12" required>
          <button type="submit" class="btn block">Se connecter</button>
          <button type="button" class="btn ghost block" id="back">Changer d'adresse</button>
        </form>
        <p class="esp-error" id="login-error" role="alert"></p>
      </div>
    </section>
    <div id="view"></div>
  </main>

  <footer class="foot">
    <img src="assets/logo-oo2.png" alt="" width="288" height="96">
    <span>Oo2 Formations &amp; Consulting pour Partners in Food Solutions</span>
  </footer>

  <div class="esp-toast" id="toast" role="status" hidden></div>

  <script src="assets/config.js"></script>
  <script src="assets/xlsx-mini.js"></script>
  <script src="assets/espace.js"></script>
</body>
</html>
